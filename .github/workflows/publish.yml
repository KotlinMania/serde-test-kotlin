name: Validate publication artifacts

on:
  workflow_dispatch:

# Maven publication runs from KotlinMania/serde-kotlin's manual serde-test
# publisher, which holds the established repository-level publishing secrets.
permissions:
  contents: read

jobs:
  validate:
    name: Validate publication artifacts
    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          check-latest: true

      - name: Set up Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Check JavaScript toolchain
        run: |
          node --version
          npm --version
          yarn --version

      - name: Build publication artifacts
        env:
          ORG_GRADLE_PROJECT_kotlin_js_yarn_download: "false"
        run: ./gradlew setupAndroidSdk compileAndroidMain androidSourcesJar --no-configuration-cache
